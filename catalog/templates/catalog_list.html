{% extends "base.html" %} {%block content%}
<div class="container">
   <!-- Фильтр по категориям -->
    <div class="row mb-4">
        <div class="col-md-12">
            <form method="get" class="row g-3">
                <div class="col-auto">
                    <label for="categoryFilter" class="visually-hidden">Категория</label>
                    <select name="category" id="categoryFilter" class="form-select" onchange="this.form.submit()">
                        <option value="">Все категории</option>
                        {% for category in categories %}
                            <option value="{{ category.slug }}" {% if selected_category == category.slug %}selected{% endif %}>
                                {{ category.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Применить</button>
                    <a href="{% url 'home' %}" class="btn btn-secondary">Сбросить</a>
                </div>
            </form>
        </div>
    </div>
  <div class="row gy-5">
    {% for product in products %}
    <div class="col-4">
      <div class="card" style="width: 18rem">
        {% if product.image %}
        <img
          src="{{ product.image.url }}"
          class="card-img-top"
          alt="{{ product.name }}"
          style="height: 200px; object-fit: cover"
        />
        {% else %}
        <div
          class="card-img-top bg-light d-flex align-items-center justify-content-center"
          style="height: 200px; color: #6c757d"
        >
          Нет фото
        </div>
        {% endif %}
        <div class="card-body">
          <h5 class="card-title">{{product.name}}</h5>
          <p class="card-text">{{product.description}}</p>
          <p class="card-text"><strong>{{ product.price }} ₽</strong></p>
          <a href="#" class="btn btn-success">К товару</a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
