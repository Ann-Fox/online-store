{% extends "base.html" %} {% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Товары через fetch</h3>
    <a href="{% url 'product-create' %}" class="btn btn-primary"
      >Создать товар</a
    >
  </div>

  <div class="mb-4">
    <label for="category-select" class="form-label">Категория</label>
    <select id="category-select" class="form-select">
      <option value="">Все</option>
      <option value="bonsaj">Бонсай</option>
      <option value="orhidei">Орхидеи</option>
      <option value="yagody">Ягоды</option>
    </select>
  </div>

  <div id="products-list" class="row"></div>
</div>

<script>
  const categorySelect = document.querySelector("#category-select");
  const productsList = document.querySelector("#products-list");

  function renderProducts(products) {
    if (products.length === 0) {
      productsList.innerHTML = `<div class="col-12"><p class="text-muted">Товары не найдены.</p></div>`;
      return;
    }

    const html = products
      .map((product) => {
        const imageHtml = product.image_url
          ? `<img src="${product.image_url}" class="card-img-top" alt="${product.name}" style="height: 200px; object-fit: cover;">`
          : `<div class="card-img-top bg-light d-flex align-items-center justify-content-center" style="height: 200px; color: #6c757d;">Нет фото</div>`;

        return `
        <div class="col-md-4 mb-4">
          <div class="card h-100">
            ${imageHtml}
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">${product.name}</h5>
              <p class="card-text">${product.description || ""}</p>
              <span class="badge text-bg-light text-dark border mb-3 align-self-start">
                ${product.category || ""}
              </span>
              <a href="/products/${product.slug}/" class="btn btn-primary mt-auto align-self-start">
                К товару
              </a>
            </div>
          </div>
        </div>
      `;
      })
      .join("");

    productsList.innerHTML = html;
  }

  async function loadProducts() {
    const category = categorySelect.value;
    const url = category
      ? `/products/product-json/?category=${category}`
      : "/products/product-json/";
    const response = await fetch(url);
    const products = await response.json();
    console.log(products);

    renderProducts(products);
  }

  categorySelect.addEventListener("change", loadProducts);

  loadProducts();
</script>
{% endblock %}
